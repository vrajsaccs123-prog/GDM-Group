<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ghanshyam Dal Mill — Daily Rates</title>
  <meta name="description" content="Today's rates from Ghanshyam Dal Mill. The list is read live from the mill price sheet.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead-inner wrap">
        <h1 class="wordmark">Ghanshyam Dal Mill</h1>
        <div class="wordmark-rule"></div>
      </div>
      <div class="masthead-bar">
        <nav class="masthead-nav wrap" aria-label="Sections">
          <a class="nav-link" href="/" data-nav="today">Today's Rates</a>
          <a class="nav-link" href="/history" data-nav="history">Rate History</a>
        </nav>
      </div>
    </header>
    <div class="stickybar" aria-hidden="true"><span id="sticky-label"></span></div>
    <div class="main">
      <main class="wrap" id="app">
        <div class="dateline">
          <span class="eyebrow">Latest rates</span>
          <span class="dateline-date">Reading the sheet…</span>
        </div>
      </main>
    </div>
  </div>
  <script>
    (function () {
      var path = location.pathname.replace(/\/index\.html$/, "");
      if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
      if (!path) path = "/";
      var mode = "today";
      var slug = "";
      if (path === "/history") mode = "history";
      else if (path.indexOf("/history/") === 0) {
        mode = "day";
        slug = decodeURIComponent(path.slice("/history/".length));
      }
      window.GDM_PAGE = { mode: mode, slug: slug };
      var nav = document.querySelector(mode === "today" ? '[data-nav="today"]' : '[data-nav="history"]');
      if (nav) {
        nav.classList.add("is-on");
        nav.setAttribute("aria-current", "page");
      }
      if (mode === "today") return;
      var app = document.getElementById("app");
      var eyebrow = mode === "history" ? "Rate history" : "Previous rates";
      var title = mode === "history" ? "Previous lists" : "Reading the sheet…";
      var eyebrowNode = app.querySelector(".eyebrow");
      var titleNode = app.querySelector(".dateline-date");
      if (eyebrowNode) eyebrowNode.textContent = eyebrow;
      if (titleNode) titleNode.textContent = title;
      document.title = mode === "history" ? "Rate History — Ghanshyam Dal Mill" : "Ghanshyam Dal Mill — Daily Rates";
    })();
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
